<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pendaftaran Mitra Lahan - PLN SPKLU</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bar:#6699ee; --btn:#2f5aa8; --accent:#f7d23e; --ink:#1a1a1a;
  --card:#fff; --field-bg:#fff; --field-border:#222; --soft:#d9d9d9; --purple:#5b3fd0;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --card:#fff; --ink:#1a1a1a; }
}
:root[data-theme="dark"]{ --card:#fff; --ink:#1a1a1a; }
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; font-family:"Noto Sans",system-ui,Arial,sans-serif; color:var(--ink); background:#1c2a44;
  min-height:100vh;
}
header.top{background:#fff; height:60px; display:flex; align-items:center; justify-content:flex-end; padding:0 24px}
.logo{display:flex; align-items:center; gap:10px}
.logo-mark{width:38px; height:38px; background:var(--accent); display:grid; place-items:center}
.logo-mark svg{width:28px; height:28px}
.logo-text{font-weight:700; font-size:26px; letter-spacing:.25em; color:#1aa3dc}
nav{background:var(--bar); height:42px; display:flex; justify-content:flex-end; align-items:center; gap:38px; padding:0 40px; flex-wrap:wrap}
nav a{color:#fff; font-weight:700; font-size:13px; text-decoration:none}
nav a.active{color:var(--accent)}
nav a:focus-visible{outline:2px solid #fff; outline-offset:3px}

main{
  min-height:calc(100vh - 102px); padding:32px 16px 48px;
  background:
    linear-gradient(180deg, rgba(20,36,70,.85) 0%, rgba(28,50,90,.7) 45%, rgba(10,18,30,.9) 100%),
    radial-gradient(ellipse at 20% 80%, #1f7a8c 0%, transparent 40%),
    radial-gradient(ellipse at 85% 75%, #a52a2a 0%, transparent 30%),
    #1c2a44;
}
h1{color:#fff; text-align:center; font-size:20px; letter-spacing:.02em; margin:0 0 32px; font-weight:700}
h1 span{color:var(--accent)}

.card{max-width:572px; margin:0 auto; background:var(--card); border-radius:8px; padding:12px 12px 14px; box-shadow:0 8px 30px rgba(0,0,0,.35)}
.card h2{font-size:18px; margin:0 0 18px; font-weight:700}
.card h2.second{margin-top:26px; padding-left:9px}
.block{padding:0 12px}
label,.lbl{display:block; font-weight:700; font-size:12.5px; margin-bottom:6px}
input[type=text],input[type=email],input[type=tel],textarea,select{
  width:100%; font:inherit; font-size:12px; background:var(--field-bg); color:var(--ink);
  border:1px solid var(--field-border); border-radius:2px; padding:5px 8px; height:19px;
}
textarea{height:56px; border-color:#bbb; resize:vertical; padding:8px}
.light{border-color:#ccc !important; height:23px !important}
select{height:23px; border-color:#ccc; color:#555; font-size:10px; padding:0 6px; background:#fff}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--purple); outline-offset:1px}
.field{margin-bottom:16px}
.row{display:grid; gap:14px; margin-bottom:16px}
.row.three{grid-template-columns:1fr 1fr 1fr}
.row.two{grid-template-columns:1fr 1fr}
.row .field{margin:0}
.row label{font-size:12.5px}
.indent{padding:0 4px 0 9px}
.upload-row{display:flex; align-items:center; gap:6px; margin-bottom:26px}
.upload-btn{border:1px solid var(--purple); color:var(--purple); background:#fff; font-size:8px; padding:4px 0; width:60px; border-radius:2px; cursor:pointer}
.file-name{background:#e6e6e6; color:#666; font-size:8px; padding:4px 5px; flex:0 1 228px; min-height:17px}
.sub{font-size:13px; font-weight:700; margin:0 0 8px}
.small-lbl{font-size:9px; font-weight:700; margin-bottom:4px}
.know{display:flex; gap:20px; justify-content:space-between; align-items:flex-start; margin-bottom:8px}
.know .q{font-size:12.5px; font-weight:700; flex:1}
.checks{flex:0 0 46%; display:flex; flex-direction:column; gap:2px}
.check{display:flex; align-items:center; gap:8px; font-size:9.5px; font-weight:400; margin:0; cursor:pointer}
input[type=checkbox]{appearance:none; -webkit-appearance:none; width:9px; height:9px; margin:0; border:1px solid #9aa; background:#fff; border-radius:1px; display:grid; place-content:center; cursor:pointer; flex:none}
input[type=checkbox]:checked{background:#fff; border-color:#b7a6ee}
input[type=checkbox]:checked::after{content:""; width:4px; height:2px; border-left:1.5px solid #8b73e0; border-bottom:1.5px solid #8b73e0; transform:rotate(-45deg) translate(0,-1px)}
.agree{display:flex; align-items:center; gap:6px; font-size:9.5px; font-weight:700; margin:0 0 16px}
.agree input{width:11px; height:11px; border-radius:2px}
.agree input:checked{background:var(--purple); border-color:var(--purple)}
.agree input:checked::after{border-color:#fff; width:6px; height:3px}
.submit{display:block; width:100%; background:var(--btn); color:#fff; border:0; border-radius:2px; font:inherit; font-size:12px; font-weight:600; padding:11px; cursor:pointer}
.submit:hover{background:#274c92}
.submit-wrap{padding:0 12px}
.msg{margin:10px 12px 0; font-size:11px; color:#1a7f37; text-align:center; min-height:14px}

@media (max-width:640px){
  nav{justify-content:center; gap:18px; padding:0 12px}
  .row.three,.row.two{grid-template-columns:1fr}
  .know{flex-direction:column}
  .checks{flex-basis:auto}
  .file-name{flex:1}
}
nav{height:56px}
.logo{margin-left:8px}
.logo-mark{width:30px;height:30px}
.logo-mark svg{width:22px;height:22px}
.logo-text{color:#fff;font-size:20px;letter-spacing:.2em}
main{min-height:calc(100vh - 56px)}

      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M17 3 7 18h7l-3 11 12-17h-7z" fill="#e03a2f"/><path d="M4 14h24M4 20h24" stroke="#1aa3dc" stroke-width="2.5" fill="none"/></svg>

<main>
  <h1>PENDAFTARAN MITRA <span>LAHAN</span></h1>

  <form class="card" id="form" novalidate>
    <h2>Informasi Pemilik Lahan</h2>

    <div class="block">
      <div class="field">
        <label for="nama">Nama Pemohon</label>
        <input type="text" id="nama" name="nama" required>
      </div>

      <div class="field">
        <label for="alamat">Alamat Lengkap</label>
        <textarea id="alamat" name="alamat" required></textarea>
      </div>
    </div>

    <div class="indent">
      <div class="row three">
        <div class="field">
          <label for="prov1">Province</label>
          <select id="prov1" name="provinsi"><option>Kota</option></select>
        </div>
        <div class="field">
          <label for="kota1">Kota</label>
          <select id="kota1" name="kota"><option>Kota</option></select>
        </div>
        <div class="field">
          <label for="pos1">Kode Pos</label>
          <input class="light" type="text" id="pos1" name="kode_pos" inputmode="numeric">
        </div>
      </div>

      <div class="row three">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="field">
          <label for="hp">No Hp</label>
          <input type="tel" id="hp" name="no_hp" required>
        </div>
        <div class="field">
          <label for="ktp">No KTP / NPWP</label>
          <input type="text" id="ktp" name="no_ktp_npwp" inputmode="numeric" required>
        </div>
      </div>
    </div>

    

      <div class="know">
        <div class="q">Bagaimana Anda mengetahui tentang kami?</div>
        <div class="checks">
          <label class="check"><input type="checkbox" name="sumber" value="sales" checked> Sales</label>
          <label class="check"><input type="checkbox" name="sumber" value="online"> Online</label>
          <label class="check"><input type="checkbox" name="sumber" value="kunjungan"> Kunjungan Langsung</label>
        </div>
      </div>

      <label class="agree"><input type="checkbox" id="setuju" checked> Saya menyetujui syarat &amp; ketentuan privasi</label>
    </div>

    <div class="submit-wrap">
      <button type="submit" class="submit">DAFTAR SEKARANG</button>
    </div>
    <div class="msg" id="msg" role="status"></div>
  </form>
</main>

<script>
  var file = document.getElementById('file'),
      name = document.getElementById('fileName');
  document.getElementById('uploadBtn').addEventListener('click', function(){ file.click(); });
  file.addEventListener('change', function(){
    if (file.files[0]) name.textContent = file.files[0].name;
  });
  document.getElementById('form').addEventListener('submit', function(e){
    e.preventDefault();
    var msg = document.getElementById('msg');
    if (!document.getElementById('setuju').checked) {
      msg.style.color = '#b42318';
      msg.textContent = 'Centang persetujuan syarat & ketentuan privasi untuk melanjutkan.';
      return;
    }
    var form = e.target, missing = [];
    form.querySelectorAll('[required]').forEach(function(f){ if (!f.value.trim()) missing.push(f); });
    if (missing.length) {
      msg.style.color = '#b42318';
      msg.textContent = 'Lengkapi semua kolom wajib terlebih dahulu.';
      missing[0].focus();
      return;
    }
    msg.style.color = '#1a7f37';
    msg.textContent = 'Pendaftaran berhasil dikirim.';
  });
</script>
</body>
</html>

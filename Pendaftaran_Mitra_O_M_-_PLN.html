<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pendaftaran Mitra O&amp;M - PLN</title>
<style>
:root{
  --bg:#12243a; --card:#fff; --text:#1a1a1a; --nav:#659af0; --accent:#ffd23f;
  --primary:#2f5aa8; --violet:#5b3fd1; --field:#fff; --border:#222; --muted:#e8e8e8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:#fff;--text:#1a1a1a}}
:root[data-theme="dark"]{--card:#fff;--text:#1a1a1a}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans","Segoe UI",Arial,sans-serif;color:var(--text);background:var(--bg)}
header{background:#fff;height:68px;display:flex;justify-content:flex-end;align-items:center;padding:0 32px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:28px;color:#1ea7e1;letter-spacing:3px}
.logo i{width:40px;height:40px;background:var(--accent);display:grid;place-items:center;font-style:normal;color:#d32f2f;font-size:24px}
nav{background:var(--nav);height:46px;display:flex;justify-content:flex-end;align-items:center;gap:44px;padding:0 40px;margin-top:2px}
nav a{color:#fff;font-weight:700;font-size:14px;text-decoration:none}
nav a.active{color:var(--accent)}
nav a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main{
  min-height:calc(100vh - 116px);padding:24px 16px 40px;
  background:
    linear-gradient(180deg,rgba(18,36,58,.75),rgba(18,36,58,.35) 40%,rgba(10,20,30,.85)),
    radial-gradient(ellipse at 20% 75%,#2f7d74 0,transparent 35%),
    radial-gradient(ellipse at 80% 70%,#a33 0,transparent 25%),
    linear-gradient(#1d3a5c,#0e1c2c);
}
h1{color:#fff;text-align:center;font-size:24px;margin:0 0 22px;letter-spacing:.3px}
h1 span{color:var(--accent)}
.card{max-width:646px;margin:0 auto;background:var(--card);border-radius:10px;padding:26px 20px 24px}
h2{font-size:20px;margin:0 0 20px}
h3{font-size:14px;margin:0 0 8px}
.section{padding:0 8px;margin-bottom:22px}
label{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
.sm label{font-size:12px;margin-bottom:3px}
input[type=text],input[type=email],input[type=tel],textarea,select{
  width:100%;background:var(--field);border:1.5px solid var(--border);border-radius:2px;
  padding:4px 8px;height:22px;font:inherit;font-size:12px;color:var(--text)}
textarea{height:64px;border-color:#ccc;resize:vertical;padding:8px}
select{border-color:#ddd;height:26px}
.field{margin-bottom:16px}
.row{display:grid;gap:14px}
.row.two{grid-template-columns:1fr 1fr}
.row.four{grid-template-columns:1fr 1fr 1.3fr 1fr}
.row.kt{grid-template-columns:1.5fr 1.5fr 1.5fr}
.upload{display:flex;gap:4px}
.upload button{background:#fff;color:var(--violet);border:1px solid var(--violet);border-radius:3px;padding:0 20px;font-size:10px;height:22px;cursor:pointer}
.upload input{background:var(--muted);border:0;flex:1;color:#555;height:22px}
.checks{display:grid;gap:8px;font-size:11px;margin-left:24px}
.checks label,.terms label{display:flex;align-items:center;gap:10px;font-weight:400;font-size:11px;margin:0}
.terms label{font-weight:700}
input[type=checkbox]{appearance:none;width:12px;height:12px;border:1px solid var(--violet);border-radius:2px;background:#fff;margin:0;display:grid;place-items:center;cursor:pointer}
input[type=checkbox]:checked{background:var(--violet)}
input[type=checkbox]:checked::after{content:"";width:3px;height:6px;border:solid #fff;border-width:0 1.5px 1.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.how{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.how h3{font-size:14px;margin-top:0;flex:1}
.how .checks{flex:1;margin-left:0}
.terms{margin:14px 0 6px 8px}
.submit{display:block;width:100%;background:var(--primary);color:#fff;border:0;height:36px;font-size:12px;letter-spacing:.5px;cursor:pointer}
.submit:hover{background:#264a8d}
@media (max-width:640px){
  nav{gap:16px;padding:0 12px;overflow-x:auto}
  .row.two,.row.four,.row.kt{grid-template-columns:1fr}
  .how{flex-direction:column}
}
nav{height:auto;min-height:56px;align-items:center}
.logo{margin-left:8px;font-size:22px;color:#fff;letter-spacing:2px;gap:6px}
.logo i{width:30px;height:30px;font-size:18px}

<body>

<nav>
  <a href="#">Beranda</a>
  <a href="#">Peta Sebaran SPKLU</a>
  <a href="#" class="active">Registrasi Mitra</a>
  <a href="#">Login</a>
  <div class="logo"><i>&#9889;</i>PLN</div>
</nav>

<main>
  <h1>PENDAFTARAN MITRA <span>O&amp;M</span></h1>
  <div class="card">
    <h2>Informasi Perusahaan</h2>
    <div class="section">
      <div class="field"><label for="perusahaan">Nama Perusahaan</label><input type="text" id="perusahaan"></div>
      <div class="field"><label for="alamat">Address</label><textarea id="alamat"></textarea></div>
      <div class="row two">
        <div><label for="provinsi">Province</label>
          <select id="provinsi"><option>Kota</option></select></div>
        <div><label for="kota">Kota</label>
          <select id="kota"><option>Kota</option></select></div>
      </div>
    </div>

    <div class="section sm">
      <h3>Detail Kontak</h3><br>
      <div class="row four field">
        <div><label for="nama">Nama Lengkap Penghubung</label><input type="text" id="nama"></div>
        <div><label for="jabatan">Jabatan</label><input type="text" id="jabatan"></div>
        <div><label for="email">Email</label><input type="email" id="email"></div>
        <div><label for="hp">No Hp</label><input type="tel" id="hp"></div>
      </div>
      <div class="row kt">
        <div><label for="ktp">No KTP / NPWP</label><input type="text" id="ktp"></div>
        <div><label for="nib">No NIB</label><input type="text" id="nib"></div>
      </div>
    </div>

    <div class="section sm">
      <h3>Dokumen Pendukung</h3>
      <label for="dok">Dokumen Legalitas</label>
      <div class="upload">
        <input type="file" id="dok" hidden>
        <button type="button" onclick="document.getElementById('dok').click()">Upload</button>
        <input type="text" id="dokName" value="Document_Pendukung.pdf" readonly>
      </div>
    </div>

    <div class="section how">
      <h3>Bagaimana Anda mengetahui tentang kami?</h3>
      <div class="checks">
        <label><input type="checkbox" checked> Sales</label>
        <label><input type="checkbox"> Online</label>
        <label><input type="checkbox"> Kunjungan Langsung</label>
      </div>
    </div>

    <div class="terms"><label><input type="checkbox" checked> Saya menyetujui syarat &amp; ketentuan privasi</label></div>
    <button class="submit" type="button">DAFTAR SEKARANG</button>
  </div>
</main>
<script>
document.getElementById('dok').addEventListener('change',function(){
  if(this.files[0]) document.getElementById('dokName').value=this.files[0].name;
});
</script>
</body>
</html>
